<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motto - Match & Connect</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* ==========================================================================
       1. Base Setup & Neon Theme Variables
       ========================================================================== */
    :root {
      --bg-dark: #0b0c10;
      --card-bg: rgba(20, 22, 34, 0.85);
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-purple: #7000ff;
      --neon-yellow: #ffea00;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-glow: rgba(0, 240, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ==========================================================================
       2. Header & Branding
       ========================================================================== */
    header {
      text-align: center;
      padding: 20px 0 15px;
    }

    .brand-logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      display: inline-block;
    }

    .brand-tagline {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* ==========================================================================
       3. Navigation Tabs
       ========================================================================== */
    .tab-nav {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 127, 0.2));
      color: #fff;
      border: 1px solid var(--border-glow);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    /* ==========================================================================
       4. Card & Form Components
       ========================================================================== */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: var(--neon-cyan);
      margin-bottom: 6px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    /* Select Targets Grid */
    .targets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .target-checkbox-label {
      display: flex;
      align-items: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .target-checkbox-label.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .target-checkbox-label input {
      margin-right: 8px;
      accent-color: var(--neon-pink);
    }

    /* Messages Section */
    .single-msg-item {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 0, 127, 0.2);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .single-msg-item label {
      color: var(--neon-pink);
      font-size: 12px;
    }

    .unrequited-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .unrequited-option input {
      margin-top: 2px;
      accent-color: var(--neon-cyan);
    }

    /* Primary Action Buttons */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Contact Buttons */
    .btn-contact {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #fff;
      box-shadow: 0 0 12px rgba(220, 39, 67, 0.4);
    }

    .btn-line {
      background: #06c755;
      color: #fff;
      box-shadow: 0 0 12px rgba(6, 199, 85, 0.4);
    }

    .btn-default {
      background: linear-gradient(135deg, var(--neon-cyan), #0077ff);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    /* ==========================================================================
       5. Countdown Overlay & Animations
       ========================================================================== */
    #countdown-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .dark-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-pulse-edges {
      box-shadow: inset 0 0 60px var(--pulse-color, var(--neon-cyan));
      animation: pulseEdge 0.75s ease-out infinite alternate;
    }

    @keyframes pulseEdge {
      from { box-shadow: inset 0 0 30px var(--pulse-color, var(--neon-cyan)); }
      to { box-shadow: inset 0 0 80px var(--pulse-color, var(--neon-cyan)); }
    }

    .countdown-num-glow {
      font-size: 100px;
      font-weight: 900;
      font-family: 'Impact', sans-serif;
    }

    .num-3 { color: var(--neon-cyan); text-shadow: 0 0 30px var(--neon-cyan); }
    .num-2 { color: var(--neon-yellow); text-shadow: 0 0 30px var(--neon-yellow); }
    .num-1 { color: var(--neon-pink); text-shadow: 0 0 30px var(--neon-pink); }

    .beat-anim {
      animation: beatScale 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes beatScale {
      0% { transform: scale(0.2); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ==========================================================================
       6. Result Display Cards & Rain Animation
       ========================================================================== */
    .result-section-header {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .result-card-success {
      background: rgba(255, 0, 127, 0.1);
      border: 2px solid var(--neon-pink);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
      position: relative;
      overflow: hidden;
    }

    .match-header-badge {
      display: inline-block;
      background: var(--neon-pink);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .match-title {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-pink);
      margin-bottom: 8px;
    }

    .partner-block {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
      text-align: left;
    }

    .partner-label-matched { font-size: 11px; color: var(--neon-pink); font-weight: bold; }
    .partner-id-matched { font-size: 18px; color: #fff; font-weight: bold; margin-bottom: 6px; }

    .result-card-approach {
      background: rgba(0, 240, 255, 0.1);
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    }

    .approach-header-badge {
      display: inline-block;
      background: var(--neon-cyan);
      color: #000;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .approach-title {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-cyan);
      margin-bottom: 8px;
    }

    .partner-label-approach { font-size: 11px; color: var(--neon-cyan); font-weight: bold; }
    .partner-id-approach { font-size: 18px; color: #fff; font-weight: bold; margin-bottom: 6px; }

    .message-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
      font-size: 13px;
    }

    .message-title-matched { color: var(--neon-pink); font-weight: bold; font-size: 11px; }
    .message-title-approach { color: var(--neon-cyan); font-weight: bold; font-size: 11px; }
    .message-text { color: #f1f5f9; margin-top: 2px; }

    .call-action-matched, .call-action-approach {
      font-size: 13px;
      font-weight: bold;
      margin-top: 12px;
      color: var(--text-main);
    }

    .thanks-footer {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 15px;
      line-height: 1.5;
    }

    /* No Match Rain & Floating Moon View */
    .neon-rain-card {
      position: relative;
      background: rgba(15, 10, 30, 0.85);
      border: 2px solid var(--neon-purple);
      box-shadow: 0 0 25px rgba(112, 0, 255, 0.3);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      overflow: hidden;
    }

    .rain-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .neon-content {
      position: relative;
      z-index: 2;
    }

    .moon-container {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      animation: moonFloat 4s ease-in-out infinite;
    }

    @keyframes moonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .moon-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.6)); }

    .star {
      position: absolute;
      fill: var(--neon-cyan);
      animation: starBlink 2s infinite alternate;
    }
    .star-1 { width: 10px; top: 0; left: 0; animation-delay: 0s; }
    .star-2 { width: 8px; top: 10px; right: 2px; animation-delay: 0.7s; }
    .star-3 { width: 12px; bottom: 0; left: 10px; animation-delay: 1.4s; }

    @keyframes starBlink {
      from { opacity: 0.2; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.2); }
    }

    .neon-title {
      font-size: 24px;
      font-weight: 900;
      color: #e9d5ff;
      text-shadow: 0 0 12px var(--neon-purple);
      margin-bottom: 8px;
    }

    .unrequited-sent-box {
      background: rgba(0, 240, 255, 0.08);
      border: 1px dashed var(--neon-cyan);
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-logo">motto</div>
      <div class="brand-tagline">More Connections, Motto Passion.</div>
    </header>

    <!-- タブ切り替え -->
    <div class="tab-nav">
      <button class="tab-btn active" onclick="showTab('vote')">💌 アプローチ選択</button>
      <button class="tab-btn" onclick="showTab('result')">✨ 結果確認</button>
    </div>

    <!-- 1. 投票（アプローチ）タブ -->
    <div id="vote-tab" class="card">
      <form id="voteForm" onsubmit="event.preventDefault(); submitVote();">
        <div class="form-group">
          <label for="my_id">あなたのID</label>
          <select id="my_id" onchange="handleSelfIdChange()">
            <option value="">選択してください</option>
            <option value="A-01">A-01</option>
            <option value="A-02">A-02</option>
            <option value="A-03">A-03</option>
            <option value="B-01">B-01</option>
            <option value="B-02">B-02</option>
            <option value="B-03">B-03</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pin">4桁のパスワード（結果確認用）</label>
          <div class="input-wrapper">
            <input type="password" id="pin" maxlength="4" placeholder="例: 1234">
            <button type="button" class="toggle-pwd-btn" onclick="togglePassword('pin', this)">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label for="contact">あなたの連絡先（LINE URL / Instagram IDなど）</label>
          <input type="text" id="contact" placeholder="例: https://line.me/ti/p/... や @instagram_id">
        </div>

        <div class="form-group">
          <label>気になっているお相手（複数選択可）</label>
          <div class="targets-grid">
            <label class="target-checkbox-label" id="lbl-A-01"><input type="checkbox" name="target" value="A-01" onchange="renderMessageInputs()"> A-01</label>
            <label class="target-checkbox-label" id="lbl-A-02"><input type="checkbox" name="target" value="A-02" onchange="renderMessageInputs()"> A-02</label>
            <label class="target-checkbox-label" id="lbl-A-03"><input type="checkbox" name="target" value="A-03" onchange="renderMessageInputs()"> A-03</label>
            <label class="target-checkbox-label" id="lbl-B-01"><input type="checkbox" name="target" value="B-01" onchange="renderMessageInputs()"> B-01</label>
            <label class="target-checkbox-label" id="lbl-B-02"><input type="checkbox" name="target" value="B-02" onchange="renderMessageInputs()"> B-02</label>
            <label class="target-checkbox-label" id="lbl-B-03"><input type="checkbox" name="target" value="B-03" onchange="renderMessageInputs()"> B-03</label>
          </div>
        </div>

        <!-- 個別メッセージ動的生成エリア -->
        <div id="messages-container" class="form-group"></div>

        <button type="submit" class="btn-submit">送信する ✨</button>
      </form>
    </div>

    <!-- 送信完了ビュー（初期非表示） -->
    <div id="complete-view" class="card" style="display: none; text-align: center;">
      <h2 style="color: var(--neon-pink); font-size: 22px; margin-bottom: 10px;">送信が完了しました！🎉</h2>
      <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px;">
        あなたのアプローチを受け付けました。<br>
        「結果確認」タブより、設定したパスワードで結果をご確認いただけます！
      </p>
      <button class="btn-submit" onclick="resetVoteForm()">内容を修正して再送信する</button>
    </div>

    <!-- 2. 結果確認タブ -->
    <div id="result-tab" class="card" style="display: none;">
      <div class="form-group">
        <label for="res_my_id">あなたのID</label>
        <select id="res_my_id">
          <option value="">選択してください</option>
          <option value="A-01">A-01</option>
          <option value="A-02">A-02</option>
          <option value="A-03">A-03</option>
          <option value="B-01">B-01</option>
          <option value="B-02">B-02</option>
          <option value="B-03">B-03</option>
        </select>
      </div>

      <div class="form-group">
        <label for="res_pin">4桁のパスワード</label>
        <div class="input-wrapper">
          <input type="password" id="res_pin" maxlength="4" placeholder="設定した4桁の数字">
          <button type="button" class="toggle-pwd-btn" onclick="togglePassword('res_pin', this)">👁️</button>
        </div>
      </div>

      <button class="btn-submit" onclick="checkResultWithAnimation()">結果を確認する 🔍</button>

      <!-- 結果表示エリア -->
      <div id="result-display" style="margin-top: 20px;"></div>
    </div>
  </div>

  <!-- カウントダウン＆ドクドク演出用固定レイヤー -->
  <div id="countdown-layer"></div>

  <script>
    /* ==========================================================================
       JavaScript Logic
       ========================================================================== */

    function handleSelfIdChange() {
      const myId = document.getElementById('my_id').value;
      const checkboxes = document.querySelectorAll('input[name="target"]');
      
      checkboxes.forEach(chk => {
        const lbl = document.getElementById(`lbl-${chk.value}`);
        if (chk.value === myId) {
          chk.checked = false;
          chk.disabled = true;
          if (lbl) lbl.classList.add('disabled');
        } else {
          chk.disabled = false;
          if (lbl) lbl.classList.remove('disabled');
        }
      });
      renderMessageInputs();
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "👁️";
      }
    }

    function triggerVibrate(pattern) {
      if ("vibrate" in navigator) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function renderMessageInputs() {
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="target"]:checked'));
      const container = document.getElementById('messages-container');
      
      const currentValues = {};
      const currentUnrequited = {};

      document.querySelectorAll('.individual-msg').forEach(ta => {
        currentValues[ta.getAttribute('data-target')] = ta.value;
      });
      document.querySelectorAll('.unrequited-chk').forEach(chk => {
        currentUnrequited[chk.getAttribute('data-target')] = chk.checked;
      });

      container.innerHTML = '';
      if (checkedBoxes.length === 0) return;

      const title = document.createElement('label');
      title.innerHTML = '💬 一言メッセージ（任意）';
      container.appendChild(title);

      checkedBoxes.forEach(box => {
        const val = box.value;
        const div = document.createElement('div');
        div.className = 'single-msg-item';
        const prevText = currentValues[val] || '';
        const prevUnreq = currentUnrequited[val] || false;

        div.innerHTML = `
          <label>【 ${val} 】さんへの一言メッセージ</label>
          <textarea class="individual-msg" data-target="${val}" placeholder="例: お話しできて楽しかったです！ぜひまた話しましょう✨" maxlength="100">${prevText}</textarea>
          
          <label class="unrequited-option">
            <input type="checkbox" class="unrequited-chk" data-target="${val}" ${prevUnreq ? 'checked' : ''}>
            <span>💌 マッチングしなくても、この人に自分のID・メッセージ・連絡先を届ける</span>
          </label>
        `;
        container.appendChild(div);
      });
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(tab === 'vote') {
        document.getElementById('result-tab').style.display = 'none';
        if(document.getElementById('complete-view').getAttribute('data-completed') === 'true') {
          document.getElementById('vote-tab').style.display = 'none';
          document.getElementById('complete-view').style.display = 'block';
        } else {
          document.getElementById('vote-tab').style.display = 'block';
          document.getElementById('complete-view').style.display = 'none';
        }
        event.target.classList.add('active');
      } else {
        document.getElementById('vote-tab').style.display = 'none';
        document.getElementById('complete-view').style.display = 'none';
        document.getElementById('result-tab').style.display = 'block';
        event.target.classList.add('active');
      }
    }

    async function submitVote() {
      const my_id = document.getElementById('my_id').value;
      const pin = document.getElementById('pin').value;
      const contact = document.getElementById('contact').value;
      const target_ids = Array.from(document.querySelectorAll('input[name="target"]:checked')).map(c => c.value);

      /* 安全策: 送信直前にも自分自身への選択がないか最終確認 */
      if (my_id && target_ids.includes(my_id)) {
        return alert("自分自身を選択して送信することはできません。");
      }

      const messages = {};
      document.querySelectorAll('.individual-msg').forEach(ta => {
        const target = ta.getAttribute('data-target');
        const text = ta.value.trim();
        if (text) messages[target] = text;
      });

      const allow_unrequited = {};
      document.querySelectorAll('.unrequited-chk').forEach(chk => {
        const target = chk.getAttribute('data-target');
        allow_unrequited[target] = chk.checked;
      });

      if (!my_id || !pin || !contact) return alert("すべての必須項目を入力してください");
      if (pin.length !== 4) return alert("パスワードは4桁で入力してください");

      triggerVibrate(50);

      try {
        const res = await fetch('/api/vote', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ my_id, pin, contact, target_ids, messages, allow_unrequited })
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('vote-tab').style.display = 'none';
          document.getElementById('complete-view').style.display = 'block';
          document.getElementById('complete-view').setAttribute('data-completed', 'true');
          document.getElementById('voteForm').reset();
          handleSelfIdChange(); // フォームリセット後も状態を同期
        } else {
          alert(data.message || "エラーが発生しました");
        }
      } catch (e) {
        alert("通信エラーが発生しました。インターネット接続をご確認ください。");
      }
    }

    function resetVoteForm() {
      document.getElementById('complete-view').style.display = 'none';
      document.getElementById('complete-view').removeAttribute('data-completed');
      document.getElementById('voteForm').reset();
      handleSelfIdChange(); // リセット時にも制御状態を初期化
      document.getElementById('vote-tab').style.display = 'block';
    }

    /* 🔗 ボタン表示用ヘルパー関数 */
    function renderContactBtn(contact) {
      if (!contact) return '';
      const contactStr = contact.toLowerCase();
      const isUrl = contact.startsWith('http://') || contact.startsWith('https://');

      if (contactStr.includes('instagram.com')) {
        return `<a href="${contact}" target="_blank" rel="noopener noreferrer" class="btn-contact btn-instagram">📸 Instagramを開く（タップして相手のプロフィールへ）</a>`;
      } else if (contactStr.includes('line.me') || contactStr.includes('line.naver.jp')) {
        return `<a href="${contact}" target="_blank" rel="noopener noreferrer" class="btn-contact btn-line">💬 LINEを開く（タップして友達追加へ）</a>`;
      } else if (isUrl) {
        return `<a href="${contact}" target="_blank" rel="noopener noreferrer" class="btn-contact btn-default">🔗 連絡先を開く（タップして相手のページへ）</a>`;
      } else {
        return `<div style="font-size:14px; font-weight:bold; color:#ff80bf; word-break:break-all; text-shadow:0 0 10px #ff007f; margin-top:8px;">連絡先: ${contact}</div>`;
      }
    }

    let rainAnimationId = null;
    function startRainEffect(canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      const raindrops = [];
      const numDrops = 40;

      for (let i = 0; i < numDrops; i++) {
        raindrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 18 + 10,
          speed: Math.random() * 5 + 3,
          opacity: Math.random() * 0.35 + 0.15
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';

        raindrops.forEach(drop => {
          ctx.strokeStyle = `rgba(112, 0, 255, ${drop.opacity})`;
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - drop.length * 0.2, drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= drop.speed * 0.2;

          if (drop.y > canvas.height) {
            drop.y = -drop.length;
            drop.x = Math.random() * canvas.width;
          }
        });

        rainAnimationId = requestAnimationFrame(draw);
      }

      if (rainAnimationId) cancelAnimationFrame(rainAnimationId);
      draw();
    }

    /* 🔍 事前認証チェック ＆ 四辺ドクドク＆マルチカラーカウントダウン演出 */
    async function checkResultWithAnimation() {
      const my_id = document.getElementById('res_my_id').value;
      const pin = document.getElementById('res_pin').value;
      const display = document.getElementById('result-display');
      const layer = document.getElementById('countdown-layer');

      if (!my_id || !pin) return alert("IDとパスワードを入力してください");

      display.innerHTML = '<div style="text-align:center; padding:15px; color:#94a3b8; font-size:14px;">照合中...</div>';

      // 1. カウントダウン前にAPIで認証（ID・パスワードが存在・一致するか確認）
      let res;
      let data;
      try {
        res = await fetch('/api/result', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ my_id, pin })
        });
        data = await res.json();
      } catch (e) {
        display.innerHTML = `<div style="color:#ff4d4d; text-align:center; padding:20px; font-weight:bold;">通信エラーが発生しました</div>`;
        return;
      }

      // 2. 認証失敗（ID/パスワード不一致等）なら即座にエラーを出して演出スキップ
      if (!res.ok) {
        triggerVibrate([100, 100, 100]);
        display.innerHTML = `<div style="color:#ff4d4d; text-align:center; padding:15px; font-weight:bold; background:rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); border-radius:10px; margin-top:15px;">⚠️ ${data.message || 'IDまたはパスワードが間違っています'}</div>`;
        return;
      }

      // 3. 認証OKの時だけカウントダウン＆四辺ドクドク演出を開始！
      const updateBeat = (num, colorClass, hexColor) => {
        layer.innerHTML = `
          <div class="dark-overlay screen-pulse-edges" style="--pulse-color: ${hexColor};">
            <div class="countdown-num-glow ${colorClass} beat-anim">${num}</div>
          </div>
        `;
      };

      // 3: シアンブルー（青系）
      updateBeat("3", "num-3", "#00f0ff");
      triggerVibrate([80, 40, 80]);

      await new Promise(r => setTimeout(r, 750));
      // 2: ゴールドイエロー（黄系）
      updateBeat("2", "num-2", "#ffea00");
      triggerVibrate([80, 40, 80]);

      await new Promise(r => setTimeout(r, 750));
      // 1: ネオンピンク（赤・ピンク系）
      updateBeat("1", "num-1", "#ff007f");
      triggerVibrate([120, 40, 150]);

      await new Promise(r => setTimeout(r, 750));
      layer.innerHTML = "";

      let html = `<div class="result-section-header">【 結 果 】</div>`;

      // 1. 💖 マッチング成功（完全ピンク＆ホワイトネオン）
      if (data.matched) {
        triggerVibrate([100, 50, 100, 50, 250]);
        html += `
          <div class="result-card-success">
            <div class="match-header-badge">✨ motto MATCHED ✨</div>
            <div class="match-title">🎉 MATCHED!</div>
            <p style="color:#ffb3d9; font-size:13.5px; font-weight:bold; margin:0 0 10px; text-shadow:0 0 10px #ff007f;">
              おめでとうございます！お互いに気になっているようです✨
            </p>
        `;

        data.matches.forEach(m => {
          html += `
            <div class="partner-block">
              <div class="partner-label-matched">【 マッチング相手 】</div>
              <div class="partner-id-matched">【 ${m.id} 】</div>
          `;

          if (m.message && m.message.trim() !== "") {
            html += `
              <div class="message-box matched-msg">
                <div class="message-title-matched">💌 相手からのメッセージ</div>
                <div class="message-text">${m.message}</div>
              </div>
            `;
          }

          html += renderContactBtn(m.contact);
          html += `</div>`;
        });

        html += `
            <div class="call-action-matched">
              さっそく連絡を取ってみましょう！✨
            </div>
            <div class="thanks-footer">
              ご参加いただきありがとうございました！<br>またのご参加を心よりお待ちしております🥂✨
            </div>
          </div>
        `;
        if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      }

      // 2. 💌 アプローチ受領（シアンブルー統一）
      if (data.has_unrequited) {
        if (!data.matched) triggerVibrate([80, 80, 150]);
        html += `
          <div class="result-card-approach">
            <div class="approach-header-badge">💌 SPECIAL APPROACH</div>
            <div class="approach-title">アプローチが届いています！</div>
            <p style="color:#38bdf8; font-size:13px; font-weight:bold; margin:0 0 10px; text-shadow:0 0 10px #00f0ff;">
              あなたに興味を持っている方から連絡先が届きました✨
            </p>
        `;

        data.unrequited_approaches.forEach(a => {
          html += `
            <div class="partner-block">
              <div class="partner-label-approach">【 送信者 】</div>
              <div class="partner-id-approach">【 ${a.id} 】</div>
          `;

          if (a.message && a.message.trim() !== "") {
            html += `
              <div class="message-box approach-msg">
                <div class="message-title-approach">💬 相手からのメッセージ</div>
                <div class="message-text">${a.message}</div>
              </div>
            `;
          }

          html += renderContactBtn(a.contact);
          html += `</div>`;
        });

        html += `
            <div class="call-action-approach">
              気になったらぜひ連絡してみましょう！💬
            </div>
            <div class="thanks-footer">
              ご参加いただきありがとうございました！<br>またのご参加を心よりお待ちしております🥂✨
            </div>
          </div>
        `;
        if (!data.matched && typeof confetti === 'function') {
          confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });
        }
      }

      // 3. 💜💙 ノーマッチング画面（青紫ネオン枠は常時発光 ＋ ゆらゆら浮遊アニメーション）
      if (!data.matched && !data.has_unrequited) {
        triggerVibrate(80);
        const mySentUnrequited = data.sent_unrequited || false;

        html += `
          <div class="neon-rain-card">
            <canvas id="rainCanvas" class="rain-canvas"></canvas>
            <div class="neon-content">
              
              <div class="moon-container">
                <svg class="star star-1" viewBox="0 0 24 24"><path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4Z"/></svg>
                <svg class="star star-2" viewBox="0 0 24 24"><path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4Z"/></svg>
                <svg class="star star-3" viewBox="0 0 24 24"><path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4Z"/></svg>

                <svg class="moon-svg" viewBox="0 0 100 100">
                  <defs>
                    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#f3e8ff" />
                      <stop offset="60%" stop-color="#c084fc" />
                      <stop offset="100%" stop-color="#7e22ce" />
                    </linearGradient>
                  </defs>
                  <path d="M 65 10 A 40 40 0 1 0 90 65 A 32 32 0 1 1 65 10 Z" fill="url(#moonGrad)" />
                  <circle cx="42" cy="38" r="3.5" fill="#581c87" opacity="0.25" />
                  <circle cx="32" cy="55" r="5" fill="#581c87" opacity="0.2" />
                  <circle cx="48" cy="68" r="3" fill="#581c87" opacity="0.25" />
                </svg>
              </div>

              <div class="neon-title">NO MATCH</div>
              <p style="font-size:13px; color:#cbd5e1; line-height:1.6; margin:0;">
                惜しくも相互マッチングとはなりませんでした。
              </p>

              ${mySentUnrequited ? `
                <div class="unrequited-sent-box">
                  <strong style="font-size:14px; color:#00f0ff;">💌 メッセージ送信済み</strong><br>
                  <span style="font-size:12.5px; display:block; margin-top:4px;">
                    「マッチングしなくても届ける」を設定したお相手の画面には、<b>あなたの連絡先とメッセージが届いています！</b><br>
                    お相手からの連絡を楽しみにお待ちください✨
                  </span>
                </div>
              ` : ''}

              <div class="thanks-footer">
                ご参加いただきありがとうございました！<br>またのご参加を心よりお待ちしております🥂✨
              </div>
            </div>
          </div>
        `;
      }

      display.innerHTML = html;

      if (!data.matched && !data.has_unrequited) {
        startRainEffect('rainCanvas');
      }
    }
  </script>
</body>
</html>

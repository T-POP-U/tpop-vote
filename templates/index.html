<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-POP シークレット投票</title>
  <!-- 🎉 紙吹雪（Confetti）ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; color: #333; overflow-x: hidden; transition: background 0.5s ease; }
    .container { max-width: 420px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 20px; position: relative; }
    h1 { font-size: 20px; margin-top: 0; text-align: center; color: #1a73e8; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #e4e6eb; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 15px; }
    .tab-btn.active { background: #1a73e8; color: white; }
    label { display: block; font-weight: bold; margin: 14px 0 6px; font-size: 14px; }
    select, input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
    .checkbox-card { background: #f7f8fa; padding: 12px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; border: 1px solid #e4e6eb; }
    .checkbox-card input { margin-right: 10px; width: 18px; height: 18px; }
    button.submit-btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    .complete-box { text-align: center; padding: 20px 10px; }
    .complete-icon { font-size: 48px; margin-bottom: 12px; }
    .re-vote-btn { background: #f0f2f5; color: #555; border: 1px solid #ccc; padding: 10px 16px; border-radius: 8px; margin-top: 20px; cursor: pointer; font-size: 14px; }

    /* ----------------------------------------------------
       🔥 暗転 ＆ ネオン発光カウントダウン
    ---------------------------------------------------- */
    .dark-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0a0a0c;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-out;
    }
    .countdown-title {
      color: #888;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .countdown-num-glow {
      font-size: 120px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f, 0 0 80px #00f0ff;
      animation: neonPulse 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite;
    }
    @keyframes neonPulse {
      0% { transform: scale(0.6); opacity: 0.3; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 15px #00f0ff); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ----------------------------------------------------
       🎉 マッチング成功演出（3D＆揺れ）
    ---------------------------------------------------- */
    .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }
    .card-3d-wrap { perspective: 1000px; margin-top: 20px; }
    .card-3d {
      transform-style: preserve-3d;
      animation: flipZoom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes flipZoom {
      0% { transform: scale(0.2) rotateY(-180deg); opacity: 0; }
      100% { transform: scale(1) rotateY(0deg); opacity: 1; }
    }
    .result-card-success {
      background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
      border: 3px solid #ff4081;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(255, 64, 129, 0.3);
      position: relative;
      overflow: hidden;
    }
    .match-header-badge {
      background: linear-gradient(45deg, #ff4081, #ff80ab);
      color: white; font-size: 14px; font-weight: bold;
      padding: 6px 16px; border-radius: 20px; display: inline-block;
      margin-bottom: 12px; letter-spacing: 2px;
    }
    .match-title { font-size: 26px; font-weight: 900; color: #ff1744; margin: 8px 0; }
    .partner-id { font-size: 32px; font-weight: 900; color: #333; margin: 12px 0; }
    .contact-badge-glow {
      background: #1a73e8; color: white; padding: 12px 18px;
      border-radius: 12px; font-size: 22px; font-weight: bold;
      display: inline-block; margin-top: 10px;
      box-shadow: 0 4px 15px rgba(26, 115, 232, 0.4); word-break: break-all;
    }

    /* ----------------------------------------------------
       🌧️ ノーマッチング演出（哀愁揺れ＆雨降り）
    ---------------------------------------------------- */
    .sad-sway { animation: sadSway 3s ease-in-out infinite; }
    @keyframes sadSway {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(6px) rotate(-1.5deg); }
      66% { transform: translateY(3px) rotate(1.5deg); }
    }
    .spotlight-bg {
      background: #121212 !important; color: white !important;
      border-radius: 16px; padding: 30px 20px; text-align: center;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
      position: relative; overflow: hidden;
    }
    .spotlight-card {
      background: radial-gradient(circle at center, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.85) 80%);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 24px;
      position: relative; z-index: 2;
    }
    .rain-drop {
      position: absolute; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.4));
      width: 1px; height: 30px; opacity: 0.5; animation: drop 1.2s infinite linear;
    }
    @keyframes drop { 0% { top: -40px; } 100% { top: 100%; } }
  </style>
</head>

    <!-- 結果確認画面 -->

      <label>自分の番号札（ID）</label>
      <select id="res_my_id">
        <option value="">選択してください</option>
        <option value="M-1">男性 M-1</option><option value="M-2">男性 M-2</option><option value="M-3">男性 M-3</option><option value="M-4">男性 M-4</option><option value="M-5">男性 M-5</option>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(tab === 'vote') {
        document.getElementById('result-tab').style.display = 'none';
        if(document.getElementById('complete-view').getAttribute('data-completed') === 'true') {
          document.getElementById('vote-tab').style.display = 'none';
          document.getElementById('complete-view').style.display = 'block';
        } else {
          document.getElementById('vote-tab').style.display = 'block';
          document.getElementById('complete-view').style.display = 'none';
        }
        event.target.classList.add('active');
      } else {
        document.getElementById('vote-tab').style.display = 'none';
        document.getElementById('complete-view').style.display = 'none';
        document.getElementById('result-tab').style.display = 'block';
        event.target.classList.add('active');
      }
    }

    async function submitVote() {
      const my_id = document.getElementById('my_id').value;
      const pin = document.getElementById('pin').value;
      const contact = document.getElementById('contact').value;
      const target_ids = Array.from(document.querySelectorAll('input[name="target"]:checked')).map(c => c.value);

      if (!my_id || !pin || !contact) return alert("すべての必須項目を入力してください");
      if (pin.length !== 4) return alert("パスワードは4桁で入力してください");

      const res = await fetch('/api/vote', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ my_id, pin, contact, target_ids })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('vote-tab').style.display = 'none';
        document.getElementById('complete-view').style.display = 'block';
        document.getElementById('complete-view').setAttribute('data-completed', 'true');
        document.getElementById('voteForm').reset();
      } else {
        alert(data.message || "エラーが発生しました");
      }
    }

    function resetVoteForm() {
      document.getElementById('complete-view').style.display = 'none';
      document.getElementById('complete-view').removeAttribute('data-completed');
      document.getElementById('vote-tab').style.display = 'block';
    }

    // 震動（バイブレーション）発火用関数
    function vibratePulse() {
      if ("vibrate" in navigator) {
        navigator.vibrate([100, 50, 100]); // ドクン、ドクンと手に響くバイブ
      }
    }

    // 🌟 全面暗転＆ネオン発光カウントダウン関数
    async function checkResultWithAnimation() {
      const my_id = document.getElementById('res_my_id').value;
      const pin = document.getElementById('res_pin').value;
      const display = document.getElementById('result-display');
      const layer = document.getElementById('countdown-layer');
      const body = document.getElementById('body');

      if (!my_id || !pin) return alert("IDとパスワードを入力してください");

      // 裏でAPIリクエストを開始
      const resPromise = fetch('/api/result', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ my_id, pin })
      });

      // 1. 暗転レイヤーの表示
      layer.innerHTML = `
        <div class="dark-overlay">
          <div class="countdown-title">MATCHING CHECK</div>
          <div id="count-num" class="countdown-num-glow">3</div>
        </div>
      `;

      // 3の振動
      vibratePulse();

      const countEl = document.getElementById('count-num');
      await new Promise(r => setTimeout(r, 850));

      if(countEl) {
        countEl.style.animation = 'none'; countEl.offsetHeight; countEl.style.animation = null;
        countEl.innerText = "2";
        vibratePulse(); // 2の振動
      }
      await new Promise(r => setTimeout(r, 850));

      if(countEl) {
        countEl.style.animation = 'none'; countEl.offsetHeight; countEl.style.animation = null;
        countEl.innerText = "1";
        vibratePulse(); // 1の振動
      }
      await new Promise(r => setTimeout(r, 850));

      // 暗転解除
      layer.innerHTML = "";

      const res = await resPromise;
      const data = await res.json();

      if (!res.ok) {
        display.innerHTML = `<div style="color:red; text-align:center; padding:20px; font-weight:bold;">${data.message}</div>`;
        return;
      }

      // --------------------------------------------------
      // 🎉 マッチング成功演出
      // --------------------------------------------------
      if (data.matched) {
        body.classList.add('shake-screen');
        if ("vibrate" in navigator) navigator.vibrate([200, 100, 200, 100, 400]); // 成功時の喜びのロングバイブ
        setTimeout(() => body.classList.remove('shake-screen'), 500);

        let html = `
          <div class="card-3d-wrap">
            <div class="card-3d result-card-success">
              <div class="match-header-badge">T-POP MATCHED</div>
              <div class="match-title">🎉 MATCHING!</div>
              <p style="color:#666; font-size:13px; margin:0;">おめでとうございます！ペア成立です</p>
              <hr style="border:none; border-top:1px dashed #ff80ab; margin: 16px 0;">
        `;

        data.matches.forEach(m => {
          html += `
            <div style="font-size:12px; color:#888;">MATCHED PARTNER</div>
            <div class="partner-id">【 ${m.id} 】</div>
          `;
          if(m.contact) {
            html += `
              <div style="font-size:12px; color:#888; margin-top:8px;">CONTACT</div>
              <div class="contact-badge-glow">${m.contact}</div>
            `;
          }
        });

        html += `
              <p style="font-size:14px; font-weight:bold; color:#ff1744; margin-top:16px;">
                💬 さっそく連絡を取ってみましょう！
              </p>
              <p style="font-size:11px; color:#aaa; margin-top:12px;">#TPOP #つくば #マッチング</p>
            </div>
          </div>
        `;
        display.innerHTML = html;
        fireConfettiSpecial();

      } else {
        // --------------------------------------------------
        // 🌧️ ノーマッチング：哀愁の降り注ぐ雨＆がっかり揺れ演出
        // --------------------------------------------------
        if ("vibrate" in navigator) navigator.vibrate(300); // 重い低音バイブ

        let dropsHtml = '';
        for(let i=0; i<12; i++) {
          const left = Math.random() * 100;
          const delay = Math.random() * 1.5;
          dropsHtml += `<div class="rain-drop" style="left:${left}%; animation-delay:${delay}s;"></div>`;
        }

        display.innerHTML = `
          <div class="spotlight-bg sad-sway">
            ${dropsHtml}
            <div class="spotlight-card">
              <div style="font-size:48px; margin-bottom:12px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));">🌙</div>
              <h3 style="margin:0 0 8px 0; font-size:20px; color:#fff;">今回はノーマッチング</h3>
              <p style="font-size:13px; color:#ccc; line-height:1.6; margin:0;">
                惜しくも今回はマッチングとなりませんでした。<br>
                素敵な出会いは次の機会に！<br>またのご参加をお待ちしています🥂
              </p>
            </div>
          </div>
        `;
      }
    }

    // 🎊 豪華版紙吹雪エフェクト
    function fireConfettiSpecial() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }
  </script>
</body>
</html>
